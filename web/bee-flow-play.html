<title>Bee Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Karla:wght@400;600;700&display=swap">
<style>
  /* Paleta: interior de colmeia. Escolha unica e deliberada - a cera e o mel
     nao tem versao clara, entao a pagina nao troca de tema, so pinta tudo. */
  :root {
    --hive:   #211705;
    --hive-2: #2E2109;
    --wax:    #F0CE7C;
    --comb:   #C08A2A;
    --paper:  #E7E0CE;
    --text:   #F6EDD9;
    --muted:  #A08D6C;
    --good:   #7FBF5A;
    --bad:    #D96A4A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--hive);
    color: var(--text);
    font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  #hud {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px 4px;
  }
  #brand {
    font-family: "Baloo 2", ui-sans-serif, system-ui, sans-serif;
    font-weight: 800; font-size: 19px; line-height: 1.05;
    color: var(--wax); letter-spacing: .01em;
    min-width: 0; flex: 0 1 auto;
  }
  #brand span {
    display: block; font-family: "Karla", sans-serif; font-weight: 400;
    font-size: 11px; color: var(--muted); letter-spacing: .04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #stats {
    margin-right: auto; display: flex; align-items: baseline; gap: 4px;
    font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #stats b {
    font-family: "Baloo 2", sans-serif; font-weight: 600;
    font-size: 16px; color: var(--text);
  }
  #stats b#sLevel { color: var(--wax); }
  #stats i { width: 1px; height: 13px; background: #4A3A18; display: inline-block; margin: 0 3px; }

  #ctl { display: flex; gap: 6px; }
  button {
    font-family: "Karla", sans-serif; font-weight: 700; font-size: 11.5px;
    color: var(--wax); background: var(--hive-2);
    border: 1px solid #4A3A18; border-radius: 8px;
    padding: 7px 9px; cursor: pointer; touch-action: manipulation;
    white-space: nowrap;
  }
  button:active { background: #3B2B0C; }
  button:focus-visible { outline: 2px solid var(--wax); outline-offset: 2px; }
  button.on { background: var(--comb); color: #24190A; border-color: var(--wax); }

  /* min-height:0 e obrigatorio: os atributos width/height do canvas lhe dao um
     tamanho intrinseco, e num flex em coluna o min-height automatico e esse
     tamanho - o canvas se recusa a encolher, come a faixa do #tip e vaza pela
     borda de baixo, levando junto a fila de cores. */
  #game { flex: 1 1 auto; min-height: 0; width: 100%; display: block; touch-action: none; }

  #tip {
    flex: 0 0 auto; padding: 5px 14px 10px; text-align: center;
    font-size: 11.5px; color: var(--muted); min-height: 28px;
  }

  #over {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(20, 13, 2, .82); backdrop-filter: blur(3px);
    padding: 24px;
  }
  #over.show { display: flex; }
  #card {
    background: var(--hive-2); border: 1px solid #4A3A18; border-radius: 16px;
    padding: 26px 24px; text-align: center; max-width: 320px;
  }
  #oStep {
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--comb); margin: 0 0 8px; font-weight: 700;
  }
  #over.show #card { animation: rise .3s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes rise { from { transform: translateY(16px) scale(.95); opacity: 0; } }
  #card h2 {
    font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 27px;
    margin: 0 0 6px; text-wrap: balance;
  }
  #card p { margin: 0 0 18px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  #card p b { color: var(--text); font-variant-numeric: tabular-nums; }
  #card button { font-size: 14px; padding: 11px 22px; }
  #card #oMap { display: block; margin: 10px auto 0; background: none;
                border-color: transparent; color: var(--muted); font-weight: 600; }
  #card #oMap:active { background: var(--hive); }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    #over.show #card { animation: none; }
  }

  /* Celular em pe. A barra cabe numa linha so durante a partida - quem some
     ali e o #brand, e quem o esconde e o syncChrome(), nao uma regra daqui:
     na tela de rota ele e o unico texto que sobra, e apagar por largura
     deixaria aquela tela muda. O que falta e tamanho: no telefone o padrao
     rende texto que nao se le e botao que o polegar erra. */
  @media (max-width: 460px) {
    #hud { gap: 8px; padding: 6px 10px 4px; }
    #stats { font-size: 13px; gap: 5px; }
    #stats b { font-size: 20px; }
    #stats i { height: 16px; margin: 0 4px; }
    #ctl { gap: 5px; }
    button { font-size: 13px; padding: 10px 12px; min-height: 42px; border-radius: 10px; }
    #tip { font-size: 12px; padding: 4px 12px 8px; min-height: 22px; }
  }
</style>

<div id="app">
  <div id="hud">
    <div id="brand">Bee Flow<span>PRIMEIRO BROTO</span></div>
    <div id="stats"><b id="sLevel">1</b><i></i><b id="sBlocks">0</b>blocos<i></i><b id="sHoney">0</b>mel</div>
    <div id="ctl">
      <button id="bMap" type="button">rota</button>
      <button id="bSpeed" type="button" aria-pressed="false">&times;1</button>
      <button id="bAgain" type="button">reiniciar</button>
    </div>
  </div>
  <canvas id="game"></canvas>
  <div id="tip">Arraste uma colmeia de baixo at&eacute; perto dos blocos da cor dela</div>
</div>

<div id="over" role="dialog" aria-modal="true">
  <div id="card">
    <p id="oStep">—</p>
    <h2 id="oTitle">—</h2>
    <p id="oBody">—</p>
    <button id="oAgain" type="button">jogar de novo</button>
    <button id="oMap" class="ghost" type="button">voltar &agrave; rota</button>
  </div>
</div>

  // e o raio, que é `radius * cell`, muda de significado junto.

  const box = canvas.getBoundingClientRect();

  const M = 1.4;

    slots[h.slot] = null; return false;
  });

  // O bloco sai do tabuleiro na COLETA, mas vira mel na ENTREGA. Terminar em
  // `filled === 0` cortaria o nível no instante da última coleta, e as abelhas
  // que ainda estivessem voltando nunca entregariam — o jogador veria 400
  // blocos virarem 398 de mel. Acaba quando a última abelha pousa.
  if (filled === 0) { if (!beesInFlight()) finish("win"); }
  else {
    loseColor = beeShortage();
    if (loseColor || deadlocked()) finish("lose");
  }
}

function arrive(b) {
  if (b.ph === 0) {
    if (cells[b.cell] === 0) { b.ph = 2; return; }
    b.carried = COLOR[KEYS[cells[b.cell] - 1]];
    reserved.delete(b.cell);
    cells[b.cell] = 0; dirty = true; refresh();
    b.ph = 1;
  } else if (b.ph === 1) {
    b.h.flight--; honey++; b.dead = true;
  } else {
    // Voltou vazia: devolve a vaga. Reposicionar nunca custa abelhas.
    b.h.flight--; b.h.bees++; b.dead = true;
  }
}

// Existe algum topo de pilha que caiba em algum lugar? Com colmeias
// territoriais, ter slot livre não basta. Varredura grossa: só precisa achar
// UM ponto, não o melhor.
function anyPlaceableDeck() {
  for (const deck of columns) {
    if (!deck.length) continue;
    const spec = deck[0], reach = spec.radius * cell, terr = !!spec.territorial;
    for (let fy = 0; fy < 12; fy++)
      for (let fx = 0; fx < 12; fx++) {
        const x = boardRect.x + boardRect.w * (fx + .5) / 12;
        const y = boardRect.y + boardRect.h * (fy + .5) / 12;
        if (canPlace(x, y, reach, terr)) return true;
      }
  }
  return false;
}

// Abelha encalhada é derrota na hora.
//
// O nível traz uma abelha por bloco, cor a cor — folga zero. Então toda abelha
// que nunca mais vai voar é um bloco que ninguém vai coletar: o final feliz já
// é impossível, por mais slot livre que ainda sobre. Sem esta conta o jogador
// seguia jogando meia partida até travar de vez, e só então descobria que a
// derrota tinha sido decidida vinte jogadas antes.
//
// Encalha a colmeia PRESA (sem remanejamento) que não tem nenhum bloco da cor
// dela dentro do raio — enterrado conta, o miolo ainda pode abrir. Colmeia que
// ainda anda alcança qualquer bloco da cor dela, em qualquer lugar, então nunca
// encalha enquanto a cor existir. Como o tabuleiro só encolhe, a condição nunca
// se desfaz: dá para declarar na hora.
//
// Devolve a cor que ficou a descoberto, ou null se ninguém está faltando.
let loseColor = null;
function beeShortage() {
  // A varredura completa só roda quando existe candidata a encalhada, que é o
  // caso raro. No quadro normal isto sai na primeira linha.
  let suspeita = false;
  for (const h of hives)
    if (h.bees > 0 && (!canMove(h) || countOf(h.key) === 0)) { suspeita = true; break; }
  if (!suspeita) return null;

  refresh();
  const need = {}, have = {}, reach = new Map();
  for (const k of KEYS) { need[k] = 0; have[k] = 0; }
  for (const h of hives) reach.set(h, 0);
  for (let i = 0; i < N; i++) {
    const v = cells[i];
    if (!v) continue;
    const k = KEYS[v - 1];
    need[k]++;
    const c = centerOf(i);
    for (const h of hives) {
      if (h.key !== k || reach.get(h)) continue;
      if (canMove(h) || Math.hypot(c.x - h.x, c.y - h.y) <= h.radius * cell) reach.set(h, 1);
    }
  }

  for (const h of hives) if (reach.get(h)) have[h.key] += h.bees;
  // Abelha carregando já tirou o bloco do tabuleiro: não está em `need`.
  for (const b of bees) if (b.ph !== 1 && reach.get(b.h)) have[b.h.key]++;
  for (const deck of columns) for (const c of deck) have[c.color] += c.bees;

  for (const k of KEYS) if (need[k] > have[k]) return k;
  return null;
}

function deadlocked() {
  if (freeSlot() >= 0 && anyPlaceableDeck()) return false;
  for (const h of hives) {
    if (h.flight > 0) return false;
    if (h.bees <= 0) return false;      // vai se aposentar e liberar o slot
    // Colmeia COM abelha mas de cor extinta fica estacionada para sempre:
    // ocupa o slot e não destrava nada. Não é esperança — pula.
    if (countOf(h.key) === 0) continue;
    if (canMove(h)) { if (frontierOf(h.key).length) return false; }
    else if (pickTarget(h) >= 0) return false;
  }
  return true;
}

/* ---------------------------------------------------------------- interacao */
const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function cellAt(x, y) {
  const c = Math.floor((x - ox) / cell), r = Math.floor((y - oy) / cell);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return -1;
  return r * COLS + c;
}

// A colmeia pousa FORA da silhueta, nunca dentro. Não basta a célula estar
// vazia: ela precisa estar ligada ao lado de fora. Um bolsão de vazio cercado
// de blocos continua sendo "dentro da imagem" — é a mesma máscara que define
// a fronteira, então a regra sai sem cálculo novo.
function canPlace(x, y, reach = 0, territorial = false, ignore = null) {
  if (!inRect(boardRect, x, y)) return false;
  const i = cellAt(x, y);
  if (i >= 0) {
    refresh();
    if (!(cells[i] === 0 && outsideMask[i] === 1)) return false;
  }
  // Território: a colmeia territorial não divide espaço. Ninguém pousa DENTRO
  // do círculo dela, e ela não pousa com ninguém dentro do círculo dela.
  // O veto é o raio da territorial, não a soma dos dois raios: exigir que os
  // círculos nem se tocassem apagava até 65% da zona de voo por colmeia, e o
  // fim de nível virava impasse. Ver DESIGN.md, "Território".
  for (const h of hives) {
    if (h === ignore) continue;
    let veto = 0;
    if (territorial) veto = reach;
    if (h.territorial) veto = Math.max(veto, h.radius * cell);
    if (veto > 0 && Math.hypot(x - h.x, y - h.y) < veto) return false;
  }
  return true;
}

// Ponto válido mais próximo do dedo. Em vez de deixar arrastar para dentro da
// imagem e recusar no fim, a colmeia desliza pela borda e o soltar sempre vale.
function nearestValid(x, y, reach, territorial, ignore) {
  if (canPlace(x, y, reach, territorial, ignore)) return [x, y];
  const step = Math.max(cell * 0.4, 6);
  for (let ring = 1; ring <= 40; ring++) {
    for (let k = 0; k < 20; k++) {
      const a = k * Math.PI / 10, r = step * ring;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (canPlace(px, py, reach, territorial, ignore)) return [px, py];
    }
  }
  return [x, y];
}

const dragReach = () => (drag.hive ? drag.hive.radius : drag.spec.radius) * cell;
const dragTerr = () => !!(drag.hive ? drag.hive.territorial : drag.spec.territorial);

// Dentro da zona de voo a colmeia gruda no ponto válido mais próximo; fora
// dela o arrasto fica inválido, que é como o jogador cancela.
function trackDrag(p) {
  if (!drag) return;
  if (inRect(boardRect, p.x, p.y)) {
    const reach = dragReach(), terr = dragTerr(), ign = drag.hive || null;
    const [x, y] = nearestValid(p.x, p.y, reach, terr, ign);
    drag.x = x; drag.y = y; drag.ok = canPlace(x, y, reach, terr, ign);
  } else {
    drag.x = p.x; drag.y = p.y; drag.ok = false;
  }
}

function pointFrom(e) {
  const b = canvas.getBoundingClientRect();
  return { x: e.clientX - b.left, y: e.clientY - b.top };
}

canvas.addEventListener("pointerdown", e => {
  const p0 = pointFrom(e);
  if (screen === "map") {
    for (let i = 0; i < mapNodes.length; i++) {
      const n = mapNodes[i];
      if (Math.hypot(p0.x - n.x, p0.y - n.y) <= n.r && isUnlocked(i)) openLevel(i);
    }
    return;
  }
  if (phase !== "play") return;
  const p = pointFrom(e);
  canvas.setPointerCapture(e.pointerId);
  for (const h of hives) {
    if (Math.hypot(p.x - h.x, p.y - h.y) > cell * 1.5) continue;
    if (!canMove(h)) {
      hint("Essa colmeia gastou os remanejamentos dela — está presa aí.");
      return;
    }
    {
      drag = { hive: h, x: p.x, y: p.y, ok: false };
      trackDrag(p);
      return;
    }
  }
  if (freeSlot() < 0) { hint("Todos os slots ocupados — espere uma colmeia esvaziar."); return; }
  for (let j = 0; j < deckRects.length; j++) {
    if (columns[j].length && inRect(deckRects[j], p.x, p.y)) {
      drag = { col: j, spec: columns[j][0], x: p.x, y: p.y, ok: false };
      trackDrag(p);
      return;
    }
  }
});

canvas.addEventListener("pointermove", e => {
  if (!drag) return;
  e.preventDefault();
  trackDrag(pointFrom(e));
});

function endDrag(e) {
  if (!drag) return;
  trackDrag(pointFrom(e));
  const { x, y, ok } = drag;      // solta no ponto já grudado, não no cru do dedo
  if (ok) {
    if (drag.hive) {
      // Toque sem arrastar não pode custar um remanejamento. Abaixo do limiar
      // nada acontece — nem move, nem gasta —, senão daria para atravessar o
      // tabuleiro de graça em passinhos.
      if (Math.hypot(x - drag.hive.x, y - drag.hive.y) > cell * .6) {
        drag.hive.x = x; drag.hive.y = y; drag.hive.used++;
      }
    }
    else {
      const s = freeSlot();
      if (s >= 0) {
        const spec = columns[drag.col].shift();
        const h = {
          key: spec.color, color: COLOR[spec.color], kind: spec.kind,
          radius: spec.radius, bees: spec.bees, moves: spec.moves ?? -1,
          territorial: !!spec.territorial,
          used: 0, x, y, slot: s, flight: 0, clock: SPAWN
        };
        slots[s] = h; hives.push(h);
      }
    }
  }
  drag = null;
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", () => { drag = null; });

/* -------------------------------------------------------------------- draw */
const HEX = a => { const p = []; for (let i = 0; i < 6; i++) { const t = Math.PI / 6 + i * Math.PI / 3; p.push([Math.cos(t) * a, Math.sin(t) * a]); } return p; };
function hexPath(x, y, r) {
  ctx.beginPath();
  HEX(r).forEach(([dx, dy], i) => i ? ctx.lineTo(x + dx, y + dy) : ctx.moveTo(x + dx, y + dy));
  ctx.closePath();
}
function label(t, r, size, color, weight, dy) {
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px "Baloo 2", ui-sans-serif, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(t, r.x + r.w / 2, r.y + r.h * dy);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawHive(x, y, color, r, text, size, moves) {
  hexPath(x, y, r);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = Math.max(1.5, r * (moves >= 0 ? .18 : .1));
  ctx.strokeStyle = shade(color, moves >= 0 ? -.65 : -.38);
  ctx.stroke();
  if (text) label(text, { x: x - r, y: y - r, w: r * 2, h: r * 2 }, size, "#241A06", 800, .5);
  if (moves >= 0) {
    // Quantos remanejamentos ainda restam. Zero = a colmeia está presa ali.
    label(moves > 0 ? "mov " + moves : "presa",
      { x: x - r * 1.6, y: y + r * .55, w: r * 3.2, h: r }, Math.max(9, r * .42),
      moves > 0 ? "#241A06" : "#7C2A14", 700, .8);
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt)));
  return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

let comb = null;
function buildComb() {
  comb = document.createElement("canvas");
  comb.width = W; comb.height = H;
  const g = comb.getContext("2d");
  g.strokeStyle = "rgba(240,206,124,.055)"; g.lineWidth = 1;
  const r = 26, dx = r * Math.sqrt(3), dy = r * 1.5;
  for (let row = -1, y = -r; y < H + r; row++, y += dy) {
    for (let x = (row % 2 ? dx / 2 : 0) - dx; x < W + dx; x += dx) {
      g.beginPath();
      HEX(r).forEach(([a, b], i) => i ? g.lineTo(x + a, y + b) : g.moveTo(x + a, y + b));
      g.closePath(); g.stroke();
    }
  }
}

// Ruído determinístico em [0,1) a partir de um índice. Estável entre sessões,
// aparelhos e quadros — o que Math.random não seria.
function hashUnit(i, salt) {
  let h = Math.imul(i + 1, 2654435761) ^ Math.imul(salt + 1, 40503);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function drawMap() {
  ctx.clearRect(0, 0, W, H);
  if (comb) ctx.drawImage(comb, 0, 0);
  for (let i = 0; i < mapNodes.length - 1; i++)
    link(mapNodes[i], mapNodes[i + 1], isUnlocked(i + 1));
  const last = mapNodes[mapNodes.length - 1];
  dotted(last.x, last.y - last.r - 8, last.x, last.y - last.r - 66, false);
  mapNodes.forEach(mapNode);
}

// Liga dois favos em L: sobe reto e depois atravessa. Uma diagonal passaria
// bem por cima do nome do nível de destino, que fica logo abaixo dele.
function link(a, b, lit) {
  dotted(a.x, a.y - a.r - 10, a.x, b.y, lit);
  const side = Math.sign(b.x - a.x);
  dotted(a.x, b.y, b.x - side * (b.r + 10), b.y, lit);
}

function dotted(x1, y1, x2, y2, lit) {
  const span = Math.hypot(x2 - x1, y2 - y1);
  if (span < 14) return;
  const steps = Math.max(1, Math.round(span / 17));
  ctx.fillStyle = lit ? "rgba(240,206,124,.85)" : "rgba(240,206,124,.2)";
  for (let k = 0; k <= steps; k++) {
    const t = k / steps;
    ctx.beginPath();
    ctx.arc(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, lit ? 3 : 2.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function mapNode(n, i) {
  const done = isCleared(i), open = isUnlocked(i);
  hexPath(n.x, n.y, n.r);
  ctx.fillStyle = done ? "#C9922E" : open ? "#F0CE7C" : "#3A2C11";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = done ? "#8A6216" : open ? "#C9922E" : "#4A3A18";
  ctx.stroke();

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (open) {
    ctx.fillStyle = "#241A06";
    ctx.font = `800 ${n.r * .86}px "Baloo 2", ui-sans-serif, sans-serif`;
    ctx.fillText(String(i + 1), n.x, n.y + n.r * .04);
  } else {
    ctx.fillStyle = "#8A7B5E";
    ctx.fillRect(n.x - n.r * .21, n.y - n.r * .04, n.r * .42, n.r * .34);
    ctx.strokeStyle = "#8A7B5E"; ctx.lineWidth = n.r * .1;
    ctx.beginPath(); ctx.arc(n.x, n.y - n.r * .04, n.r * .15, Math.PI, 0); ctx.stroke();
  }

  if (done) {
    const sx = n.x + n.r * .72, sy = n.y - n.r * .72;
    ctx.fillStyle = "#4A7A38";
    ctx.beginPath(); ctx.arc(sx, sy, n.r * .3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = n.r * .1; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(sx - n.r * .13, sy);
    ctx.lineTo(sx - n.r * .03, sy + n.r * .11);
    ctx.lineTo(sx + n.r * .14, sy - n.r * .11);
    ctx.stroke(); ctx.lineCap = "butt";
  }

  if (open) {
    ctx.fillStyle = "#F6EDD9";
    ctx.font = `700 ${Math.max(12.5, n.r * .42)}px "Karla", ui-sans-serif, sans-serif`;
    ctx.fillText(LEVELS[i].name, n.x, n.y + n.r + 15);
    const rec = fmtTime(bestTime(i)), band = (LEVELS[i].meta || {}).band || "";
    ctx.fillStyle = "#A08D6C";
    ctx.font = `400 ${Math.max(10, n.r * .32)}px "Karla", ui-sans-serif, sans-serif`;
    ctx.fillText(rec ? `${band} \u00b7 recorde ${rec}` : band, n.x, n.y + n.r + 31);
  } else {
    ctx.fillStyle = "#8A7B5E";
    ctx.font = `600 ${Math.max(10.5, n.r * .34)}px "Karla", ui-sans-serif, sans-serif`;
    ctx.fillText(`ven\u00e7a o n\u00edvel ${i}`, n.x, n.y + n.r + 15);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (comb) ctx.drawImage(comb, 0, 0);

  // Zona de voo
  roundRect(boardRect.x, boardRect.y, boardRect.w, boardRect.h, 12);
  ctx.fillStyle = "rgba(231,224,206,.93)"; ctx.fill();

  ctx.save();
  roundRect(boardRect.x, boardRect.y, boardRect.w, boardRect.h, 12);
  ctx.clip();   // segura os circulos de raio dentro do tabuleiro

  const g = Math.max(.5, cell * .07), s = cell - g;
  for (let i = 0; i < N; i++) {
    const v = cells[i];
    if (!v) continue;
    const x = ox + (i % COLS) * cell + g / 2, y = oy + ((i / COLS) | 0) * cell + g / 2;
    const base = COLOR[KEYS[v - 1]];
    ctx.fillStyle = base; ctx.fillRect(x, y, s, s);
    ctx.fillStyle = shade(base, .22); ctx.fillRect(x, y, s, s * .2);
    ctx.fillStyle = shade(base, -.16); ctx.fillRect(x, y + s * .8, s, s * .2);
  }

  for (const h of hives) ring(h.x, h.y, h.radius * cell, h.color, h.territorial);
  if (drag) {
    ring(drag.x, drag.y, dragReach(),
      drag.hive ? drag.hive.color : COLOR[drag.spec.color], dragTerr());
    // Enquanto arrasta, mostra as áreas que barram o pouso — o mesmo veto que
    // canPlace aplica, senão o tracejado promete um pouso que a regra recusa.
    for (const h of hives) {
      if (h === drag.hive) continue;
      let veto = 0;
      if (dragTerr()) veto = dragReach();
      if (h.territorial) veto = Math.max(veto, h.radius * cell);
      if (veto <= 0) continue;
      ctx.beginPath();
      ctx.arc(h.x, h.y, veto, 0, Math.PI * 2);
      ctx.setLineDash([4, 6]); ctx.strokeStyle = "rgba(217,106,74,.8)";
      ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
    }
  }

  for (const b of bees) drawBee(b);
  for (const h of hives)
    drawHive(h.x, h.y, h.color, cell * .92, String(h.bees), cell * .78,
      h.moves < 0 ? -1 : h.moves - h.used);

  if (drag) {
    const col = drag.hive ? drag.hive.color : COLOR[drag.spec.color];
    const nb = drag.hive ? drag.hive.bees : drag.spec.bees;
    drawHive(drag.x, drag.y, col, cell * 1.02, String(nb), cell * .82,
      drag.hive ? drag.hive.moves - drag.hive.used
                : ((drag.spec.moves ?? -1) < 0 ? -1 : drag.spec.moves));
    ctx.beginPath(); ctx.arc(drag.x, drag.y, cell * 1.35, 0, Math.PI * 2);
    ctx.strokeStyle = drag.ok ? "#7FBF5A" : "#D96A4A"; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();

  drawSlots(); drawDecks();
}

function ring(x, y, r, color, territorial) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = shade(color, .0).replace("rgb", "rgba").replace(")", ",.10)");
  ctx.fill();
  ctx.strokeStyle = shade(color, -.15); ctx.globalAlpha = .55;
  ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
  if (territorial) {
    // Anel duplo tracejado: "esta área não divide espaço com ninguém".
    ctx.beginPath(); ctx.arc(x, y, Math.max(4, r - 5), 0, Math.PI * 2);
    ctx.setLineDash([7, 5]); ctx.strokeStyle = "#E8698C"; ctx.globalAlpha = .85;
    ctx.lineWidth = 2.5; ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
}

function drawBee(b) {
  const r = Math.max(4.5, cell * .3), y = b.y + Math.sin(b.wob) * r * .25, ink = "#241A06";
  ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(b.x, y, r * 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = b.h.color; ctx.beginPath(); ctx.arc(b.x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1, r * .22);
  ctx.beginPath(); ctx.moveTo(b.x - r * .4, y - r * .7); ctx.lineTo(b.x - r * .4, y + r * .7);
  ctx.moveTo(b.x + r * .2, y - r * .8); ctx.lineTo(b.x + r * .2, y + r * .8); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.arc(b.x - r * .5, y - r * .85, r * .62, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(b.x + r * .45, y - r * .9, r * .62, 0, Math.PI * 2); ctx.fill();
  if (b.ph === 1 && b.carried) {
    const s = r * 1.5;
    ctx.fillStyle = b.carried; ctx.fillRect(b.x - s / 2, y - r * 2.3, s, s);
    ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.strokeRect(b.x - s / 2, y - r * 2.3, s, s);
  }
}

function drawSlots() {
  slotRects.forEach((r, i) => {
    const h = slots[i];
    roundRect(r.x, r.y, r.w, r.h, 9);
    if (!h) {
      ctx.fillStyle = "rgba(240,206,124,.07)"; ctx.fill();
      ctx.strokeStyle = "rgba(240,206,124,.28)"; ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
      label("livre", r, 11, "rgba(240,206,124,.5)", 600, .56);
    } else {
      ctx.fillStyle = shade(h.color, -.62); ctx.fill();
      ctx.strokeStyle = h.color; ctx.lineWidth = 1.5; ctx.stroke();
      drawHive(r.x + r.w / 2, r.y + r.h * .42, h.color, r.h * .28, String(h.bees), r.h * .26);
      label(h.kind, { x: r.x, y: r.y, w: r.w, h: r.h }, 9.5, "rgba(246,237,217,.62)", 600, .85);
    }
  });
}

function drawDecks() {
  deckRects.forEach((r, j) => {
    const deck = columns[j];
    if (!deck.length) {
      roundRect(r.x, r.y, r.w, r.h, 9);
      ctx.strokeStyle = "rgba(240,206,124,.15)"; ctx.lineWidth = 1.5; ctx.stroke();
      return;
    }

    // A fila do que vem, nas cores REAIS. Antes eram tocos escuros: o jogador
    // via que havia mais colmeias, mas não de quais cores — e a ordem das
    // cores é exatamente a informação de que ele precisa para planejar.
    const slice = Math.max(7, r.h * .17);
    const room = Math.max(0, deckSpace - r.h - 4);
    const fila = Math.min(deck.length - 1, Math.floor(room / slice));
    for (let k = 1; k <= fila; k++) {
      const y = r.y + r.h + (k - 1) * slice;
      roundRect(r.x + 3, y, r.w - 6, slice - 1.5, 3);
      ctx.fillStyle = shade(COLOR[deck[k].color], -.05 * k - .04);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = 1; ctx.stroke();
    }

    const spec = deck[0], col = COLOR[spec.color];
    const limited = (spec.moves ?? -1) >= 0;
    roundRect(r.x, r.y, r.w, r.h, 9);
    ctx.fillStyle = col; ctx.fill();
    // Contorno grosso e escuro marca mobilidade limitada.
    ctx.strokeStyle = shade(col, limited ? -.7 : -.35);
    ctx.lineWidth = limited ? 4 : 2;
    ctx.stroke();
    // O hexágono cresce com o raio: o alcance se lê sem texto, e por isso o
    // nome do tipo saiu — era redundante e comia a altura da fila.
    drawHive(r.x + r.w * .2, r.y + r.h * .44, shade(col, .3),
      Math.max(6, Math.min(r.h * .27, spec.radius * 1.9)), "", 0);
    const n = String(spec.bees);
    label(n, { x: r.x + r.w * .4, y: r.y, w: r.w * .54, h: r.h },
      r.h * (n.length > 1 ? .38 : .46), "#241A06", 800, .58);
    if (spec.territorial) {
      // Faixa rosa no pé do token: marca território ANTES de o jogador puxar.
      roundRect(r.x + 3, r.y + r.h - 7, r.w - 6, 4, 2);
      ctx.fillStyle = "#E8698C"; ctx.fill();
    }
    if (limited) {
      roundRect(r.x + 4, r.y + 3, 40, 15, 4);
      ctx.fillStyle = "#241A06"; ctx.fill();
      label("mov " + spec.moves, { x: r.x + 4, y: r.y + 3, w: 40, h: 15 },
        9, "#F0CE7C", 700, .76);
    }
    if (deck.length > 1)
      label("x" + deck.length, { x: r.x + r.w - 21, y: r.y + 2, w: 19, h: 14 },
        9, "rgba(36,26,6,.72)", 700, .72);
  });
}

/* --------------------------------------------------------------------- app */
const over = document.getElementById("over");
const tip = document.getElementById("tip");
let tipHold = 0;
function hint(t) { tip.textContent = t; tipHold = 2.5; }

function finish(kind) {
  if (phase !== "play") return;
  phase = kind;
  const t = document.getElementById("oTitle");
  const body = document.getElementById("oBody");
  const btn = document.getElementById("oAgain");
  const step = document.getElementById("oStep");
  step.textContent = "N\u00edvel " + (li + 1) + " de " + LEVELS.length;

  if (kind === "win") {
    progress.cleared[LEVEL.id] = true;
    const prev = progress.best[LEVEL.id];
    // Aqui MENOR é melhor, ao contrário do mel.
    if (!prev || !prev.time || prev.time > playTime)
      progress.best[LEVEL.id] = { time: playTime, waste: dispatched - filledAtStart };
    saveProgress();
  }

  if (kind === "win" && li < LEVELS.length - 1) {
    const nx = LEVELS[li + 1];
    t.textContent = "N\u00edvel " + (li + 1) + " limpo";
    body.innerHTML = `<b>${honey}</b> de mel com <b>${dispatched}</b> abelhas.<br>`
      + `A seguir: <b>${nx.name}</b> — ${nx.rows}&times;${nx.cols}, `
      + `${Object.keys(nx.palette).length} cores.`;
    btn.textContent = "N\u00edvel " + (li + 2) + " \u2192";
    btn.dataset.act = "next";
  } else if (kind === "win") {
    t.textContent = "Campanha limpa";
    body.innerHTML = `Voc&ecirc; fechou os ${LEVELS.length} n&iacute;veis do prot&oacute;tipo `
      + `com <b>${honey}</b> de mel neste \u00faltimo.`;
    btn.textContent = "come\u00e7ar de novo";
    btn.dataset.act = "first";
  } else if (loseColor) {
    // Derrota anunciada no instante em que fica decidida, não vinte jogadas
    // depois: cada abelha presa é um bloco que ninguém mais coleta.
    const nome = (LEVEL.palette[loseColor] || {}).name || loseColor;
    t.textContent = "Colmeia presa";
    body.innerHTML = `Uma colmeia sem remanejamento ficou fora do alcance da cor dela. `
      + `As abelhas presas n&atilde;o voam mais, e sem elas os blocos de `
      + `<b>${nome}</b> n&atilde;o t&ecirc;m quem colete — o n&iacute;vel tem uma abelha `
      + `por bloco, exatamente. Sobraram <b>${filled}</b> blocos.`;
    btn.textContent = "tentar de novo";
    btn.dataset.act = "retry";
  } else {
    t.textContent = "Sem movimentos";
    body.innerHTML = `Sobraram <b>${filled}</b> blocos. Os slots travaram com colmeias que `
      + `n&atilde;o alcan&ccedil;am nenhuma cor dispon&iacute;vel — a ordem em que voc&ecirc; `
      + `puxa as pilhas &eacute; o jogo.`;
    btn.textContent = "tentar de novo";
    btn.dataset.act = "retry";
  }
  over.classList.add("show");
}

let last = 0;
// Gancho de teste: dt fixo torna a simulação determinística, como o
// --fixed-fps do Godot. Jogo real (fixedDt = 0) segue o relógio de verdade.
let fixedDt = 0;
// Gancho de teste: avança n quadros de simulação sincronamente, sem rAF e sem
// desenhar. Com fixedDt, o teste dirige o jogo inteiro de forma determinística.
function tick(n) {
  const dt = (fixedDt > 0 ? fixedDt : 1 / 60) * speed;
  for (let i = 0; i < n && phase === "play"; i++) step(dt);
}
function frame(t) {
  const dt = (fixedDt > 0 ? fixedDt : Math.min(0.05, (t - last) / 1000)) * speed;
  last = t;
  if (screen === "game") {
    // Com fixedDt ativo (teste), o rAF só desenha - tick() é o único motor.
    // Senão o relógio de parede pisaria na simulação junto com o teste.
    if (phase === "play" && fixedDt === 0) step(dt);
    draw();
    document.getElementById("sBlocks").textContent = filled;
    document.getElementById("sHoney").textContent = honey;
  } else {
    drawMap();
  }
  if (tipHold > 0) { tipHold -= dt; if (tipHold <= 0) tip.textContent = defaultTip(); }
  requestAnimationFrame(frame);
}

function defaultTip() {
  if (screen === "map")
    return "Toque num favo para jogar. O pr\u00f3ximo abre quando voc\u00ea vencer o atual.";
  if (phase !== "play") return "";
  if (!hives.length) return "Arraste uma colmeia at\u00e9 fora da imagem, perto da cor dela";
  if (freeSlot() < 0) return "Slots cheios — arraste uma colmeia parada para outro ponto";
  return "Só blocos da borda saem — o miolo abre sozinho conforme a imagem encolhe";
}

document.getElementById("bSpeed").onclick = e => {
  speed = speed > 1.5 ? 1 : 2;
  e.target.innerHTML = speed > 1.5 ? "&times;2" : "&times;1";
  e.target.classList.toggle("on", speed > 1.5);
  e.target.setAttribute("aria-pressed", speed > 1.5);
};
document.getElementById("bAgain").onclick = () => reset();
document.getElementById("bMap").onclick = () => showMap();
document.getElementById("oMap").onclick = () => showMap();
document.getElementById("oAgain").onclick = e => {
  const act = e.currentTarget.dataset.act;
  if (act === "next") reset(li + 1);
  else if (act === "first") reset(0);
  else reset();
};

function boot() {
  progress = loadProgress();
  reset(0); buildComb(); layout(); buildComb();
  showMap();
  requestAnimationFrame(t => { last = t; frame(t); });
}
addEventListener("resize", () => { layout(); buildComb(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
</script>
